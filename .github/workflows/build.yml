name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: swift test -v

  build-app:
    name: Build CaptureStream.app (Apple Silicon)
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build release (arch arm64)
        run: |
          swift build -c release --arch arm64 -v

      - name: Compile Metal shaders
        run: |
          xcrun -sdk macosx metal -c Sources/CaptureStreamUI/Shaders.metal -o /tmp/shaders.air
          xcrun -sdk macosx metallib /tmp/shaders.air -o default.metallib
          ls -la default.metallib

      - name: Assemble .app bundle
        run: |
          APP="CaptureStream.app"
          CONTENTS="$APP/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"
          cp .build/arm64-apple-macosx/release/CaptureStreamApp "$CONTENTS/MacOS/CaptureStream"
          cp default.metallib "$CONTENTS/Resources/default.metallib"
          VERSION="$(date +%Y.%m.%d-%H%M)-${GITHUB_SHA:0:7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > "$CONTENTS/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>CaptureStream</string>
            <key>CFBundleIdentifier</key><string>com.mazzy.capturestream</string>
            <key>CFBundleName</key><string>CaptureStream</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSCameraUsageDescription</key><string>CaptureStream displays video from your USB/Thunderbolt capture card.</string>
            <key>NSMicrophoneUsageDescription</key><string>CaptureStream plays audio from your capture card HDMI input.</string>
            <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          echo "Assembled $APP version $VERSION"
          codesign --force --deep --sign - "$APP" || true
          zip -qry CaptureStream.zip "$APP"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureStream-macOS
          path: |
            CaptureStream.app
            CaptureStream.zip
          retention-days: 30

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CaptureStream.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
